<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WireFrame Library Viewer</title>
<!--
  The published library, read the way the app reads it: lib_index.json, then
  the shards it lists. Nothing is baked into this page, so it cannot disagree
  with the index it sits next to.

  3D comes out of the part's own zip (parts/<slug>.zip) — the file the app
  installs — and is drawn on that zip's footprint pads, placed by the
  footprint's own (model ... offset / rotate / scale). A model that does not
  sit on its pads shows at a glance; a model guessed from a name cannot appear.

  Open it with `python3 tools/view.py`: a page opened from disk may not read
  the files next to it. parts/ is the release payload — present where the
  library is built, gitignored elsewhere — so a downloaded zip can also be
  dropped on the 3D panel.
-->
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --panel-2: #eef0f3; --line: #d9dde3;
  --text: #1c2026; --muted: #5d6673; --accent: #1f6feb; --accent-text: #ffffff;
  --ok: #1a7f37; --warn: #9a6700; --bad: #cf222e; --chip: #e7ebf0;
  --img-bg: #1b1d21; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111317; --panel: #181b20; --panel-2: #20242b; --line: #2c313a;
    --text: #e6e9ee; --muted: #9aa3b0; --accent: #4c8dff; --accent-text: #0b0d10;
    --ok: #3fb950; --warn: #d29922; --bad: #f85149; --chip: #262b33;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  --bg: #111317; --panel: #181b20; --panel-2: #20242b; --line: #2c313a;
  --text: #e6e9ee; --muted: #9aa3b0; --accent: #4c8dff; --accent-text: #0b0d10;
  --ok: #3fb950; --warn: #d29922; --bad: #f85149; --chip: #262b33;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); }
.bar { max-width: 1500px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.brand { font-weight: 650; margin-right: 6px; white-space: nowrap; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
input[type=search], select { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2);
  color: var(--text); padding: 0 8px; font: inherit; min-width: 0; }
input[type=search] { flex: 1 1 260px; }
select { max-width: 220px; }
label.tog { display: inline-flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; user-select: none; }
.count { color: var(--muted); margin-left: auto; white-space: nowrap; }
button { height: 30px; border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 6px;
  padding: 0 10px; font: inherit; cursor: pointer; }
button:hover { border-color: var(--accent); }

.notice { max-width: 1500px; margin: 12px auto 0; padding: 10px 14px; border: 1px solid var(--warn); border-radius: 8px;
  background: var(--panel); display: none; }
main { max-width: 1500px; margin: 0 auto; padding: 14px 16px 40px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; box-shadow: var(--shadow); }
.card:hover { border-color: var(--accent); }
.thumbs { display: grid; grid-template-columns: 1fr 1fr; background: var(--img-bg); }
.thumbs img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; min-width: 0; }
.card .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sub { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.desc { color: var(--muted); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 2.9em; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { background: var(--chip); color: var(--muted); border-radius: 4px; padding: 0 6px; font-size: 11.5px; line-height: 19px; white-space: nowrap; }
.chip.ok { color: var(--ok); }
.more { text-align: center; color: var(--muted); padding: 18px; }

dialog { width: min(1180px, calc(100vw - 24px)); max-height: calc(100vh - 24px); border: 1px solid var(--line); border-radius: 12px;
  background: var(--panel); color: var(--text); padding: 0; box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(0,0,0,.55); }
.dhead { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px; border-bottom: 1px solid var(--line);
  position: sticky; top: 0; background: var(--panel); z-index: 2; }
.dhead h2 { margin: 0; font-size: 17px; word-break: break-all; }
.dhead .sub { white-space: normal; }
.dhead button { margin-left: auto; flex: none; }
.dbody { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; padding: 16px; }
.pics { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pics figure { margin: 0; background: var(--img-bg); border-radius: 8px; overflow: hidden; }
.pics img { width: 100%; aspect-ratio: 1; object-fit: contain; display: block; }
.pics figcaption { font-size: 11.5px; color: #9aa3b0; padding: 4px 8px; }
.viewer3d { position: relative; margin-top: 10px; height: 380px; background: var(--img-bg); border-radius: 8px; overflow: hidden; }
.viewer3d canvas { display: block; width: 100%; height: 100%; }
.viewer3d .msg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
  color: #c9d1d9; padding: 24px; font-size: 13px; }
.viewer3d .msg div { max-width: 460px; }
.viewer3d.drop { outline: 2px dashed var(--accent); outline-offset: -6px; }
.v3info { font-size: 12.5px; color: var(--muted); margin-top: 6px; min-height: 1.4em; }
.v3info b { color: var(--text); font-weight: 600; }
.v3info .bad { color: var(--bad); }
.v3info .warn { color: var(--warn); }
table.kv { width: 100%; border-collapse: collapse; font-size: 13px; }
table.kv td { border-bottom: 1px solid var(--line); padding: 5px 4px; vertical-align: top; word-break: break-word; }
table.kv td:first-child { color: var(--muted); width: 120px; white-space: nowrap; }
h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 16px 0 6px; }
ul.files { margin: 0; padding-left: 18px; font-size: 12.5px; }
@media (max-width: 860px) {
  .dbody { grid-template-columns: 1fr; }
  .viewer3d { height: 300px; }
  select { max-width: 46%; }
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="brand">WireFrame Library <small id="gen"></small></span>
    <input id="q" type="search" placeholder="Search name, description, footprint, keyword…" autocomplete="off">
    <select id="cls" autocomplete="off"><option value="">All classes</option></select>
    <select id="src" autocomplete="off"><option value="">All sources</option></select>
    <select id="tier" autocomplete="off"><option value="">Any tier</option><option value="A">Tier A</option><option value="B">Tier B</option><option value="C">Tier C</option></select>
    <select id="mount" autocomplete="off"><option value="">Any mount</option><option value="smd">SMD</option><option value="through_hole">Through-hole</option></select>
    <label class="tog"><input type="checkbox" id="has3d" autocomplete="off"> 3D</label>
    <label class="tog"><input type="checkbox" id="hasContract" autocomplete="off"> Contract</label>
    <label class="tog"><input type="checkbox" id="hasDs" autocomplete="off"> Datasheet</label>
    <select id="sort" autocomplete="off"><option value="score">Best first</option><option value="name">Name</option><option value="pins">Most pins</option></select>
    <span class="count" id="count">loading…</span>
  </div>
</header>
<div class="notice" id="notice"></div>
<main>
  <div class="grid" id="grid"></div>
  <div class="more" id="more"></div>
</main>

<dialog id="detail">
  <div class="dhead">
    <div style="min-width:0">
      <h2 id="dName"></h2>
      <div class="sub" id="dSub"></div>
    </div>
    <button id="dClose">Close</button>
  </div>
  <div class="dbody">
    <div>
      <div class="pics">
        <figure><img id="dSym" alt="symbol"><figcaption>Symbol</figcaption></figure>
        <figure><img id="dFp" alt="footprint"><figcaption>Footprint</figcaption></figure>
      </div>
      <div class="viewer3d" id="v3"><div class="msg" id="v3msg"><div></div></div></div>
      <div class="v3info" id="v3info"></div>
    </div>
    <div>
      <table class="kv" id="dKv"></table>
      <h3>Contract</h3>
      <div id="dContract" class="sub" style="white-space:normal"></div>
      <h3>In the zip</h3>
      <ul class="files" id="dFiles"><li class="sub">—</li></ul>
    </div>
  </div>
</dialog>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
const PAGE = 60;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const base = (url) => (url || '').split('/').pop();
// The shards point previews at raw.githubusercontent; the copy beside this page
// is the same file and also covers parts not pushed yet.
const local = (url) => url ? 'previews/' + base(url) : '';
// The tools rewrite these files in place; a cached copy is a stale answer.
const fresh = (url) => fetch(url, { cache: 'no-cache' });
const num = (v) => (Math.round(v * 100) / 100).toString();
const size = (b) => b == null ? '' : b > 1e6 ? (b / 1e6).toFixed(1) + ' MB' : b > 1e3 ? Math.round(b / 1e3) + ' kB' : b + ' B';

let parts = [], filtered = [], shown = 0;
const contracts = new Map();

// ── loading ─────────────────────────────────────────────────────────────────
async function load() {
  if (location.protocol === 'file:') {
    note('This page was opened from disk, and the browser will not let it read the index beside it. ' +
         'Run <code>python3 tools/view.py</code> in the wireframe_lib checkout.');
  }
  const index = await (await fresh('lib_index.json')).json();
  $('gen').textContent = `${(index.counts?.total ?? 0).toLocaleString()} parts · ${String(index.generated_at || '').slice(0, 10)}`;
  const shards = await Promise.all(index.shards.map(async (s) => (await (await fresh(s.file)).json()).entries));
  parts = shards.flat();
  for (const p of parts)
    p._text = [p.name, p.description, p.footprint, p.library, p.id, p.class, ...(p.keywords || [])].join(' ').toLowerCase();
  fillClasses(countBy(parts, (p) => p.class || '?'));
  for (const [k, n] of countBy(parts, (p) => p.source || '?')) $('src').add(new Option(`${k} (${n})`, k));
  readHash();
  apply();
  // Contracts are a second file; the grid does not wait for it.
  fresh('contracts/contract_index.json').then((r) => r.ok ? r.json() : null).then((ci) => {
    for (const c of ci?.parts || []) contracts.set(c.slug, c);
    apply(true);
  }).catch(() => {});
}

function countBy(list, key) {
  const m = new Map();
  for (const x of list) m.set(key(x), (m.get(key(x)) || 0) + 1);
  return [...m.entries()].sort((a, b) => a[0].localeCompare(b[0]));
}

function fillClasses(counts) {
  const roots = new Map();
  for (const [k, n] of counts) {
    const root = k.split('.')[0];
    if (!roots.has(root)) roots.set(root, []);
    roots.get(root).push([k, n]);
  }
  for (const [root, items] of roots) {
    const g = document.createElement('optgroup');
    g.label = root;
    g.appendChild(new Option(`${root} — all (${items.reduce((s, [, n]) => s + n, 0)})`, root + '.*'));
    for (const [k, n] of items) g.appendChild(new Option(`${k} (${n})`, k));
    $('cls').appendChild(g);
  }
}

function note(html) { const el = $('notice'); el.innerHTML = html; el.style.display = 'block'; }

// ── filtering ───────────────────────────────────────────────────────────────
const controls = ['q', 'cls', 'src', 'tier', 'mount', 'has3d', 'hasContract', 'hasDs', 'sort'];

function state() {
  const s = {};
  for (const id of controls) { const el = $(id); s[id] = el.type === 'checkbox' ? el.checked : el.value; }
  return s;
}

// The hash is the whole state: a browser restoring form values on reload
// would otherwise filter by a source nobody picked.
function readHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  for (const id of controls) {
    const el = $(id);
    if (el.type === 'checkbox') el.checked = h.get(id) === '1';
    else el.value = h.get(id) ?? (el.tagName === 'SELECT' ? el.options[0].value : '');
  }
}

function writeHash(s) {
  const h = new URLSearchParams();
  for (const [k, v] of Object.entries(s)) if (v && !(k === 'sort' && v === 'score')) h.set(k, v === true ? '1' : v);
  history.replaceState(null, '', location.pathname + location.search + (h.toString() ? '#' + h : ''));
}

function apply(keepScroll) {
  const s = state();
  writeHash(s);
  const words = s.q.toLowerCase().split(/\s+/).filter(Boolean);
  const root = s.cls.endsWith('.*') ? s.cls.slice(0, -2) : null;
  filtered = parts.filter((p) =>
    (!s.cls || (root ? (p.class || '').split('.')[0] === root : p.class === s.cls)) &&
    (!s.src || p.source === s.src) &&
    (!s.tier || p.tier === s.tier) &&
    (!s.mount || p.mount === s.mount) &&
    (!s.has3d || p.has_3d) &&
    (!s.hasContract || contracts.has(p.slug)) &&
    (!s.hasDs || /^https?:/.test(p.datasheet || '')) &&
    words.every((w) => p._text.includes(w)));
  const by = {
    score: (a, b) => (b.score ?? 0) - (a.score ?? 0) || a.name.localeCompare(b.name),
    name: (a, b) => a.name.localeCompare(b.name),
    pins: (a, b) => (b.pin_count ?? 0) - (a.pin_count ?? 0) || a.name.localeCompare(b.name),
  }[s.sort];
  filtered.sort(by);
  $('count').textContent = `${filtered.length.toLocaleString()} of ${parts.length.toLocaleString()}`;
  const keep = keepScroll ? shown : 0;
  $('grid').innerHTML = '';
  shown = 0;
  do renderMore(); while (shown < keep && shown < filtered.length);
}

function chipsFor(p) {
  const c = contracts.get(p.slug);
  return [
    `<span class="chip">${esc(p.tier || '?')}</span>`,
    p.mount ? `<span class="chip">${p.mount === 'through_hole' ? 'THT' : esc(p.mount.toUpperCase())}</span>` : '',
    p.pin_count ? `<span class="chip">${p.pin_count} pin${p.pin_count === 1 ? '' : 's'}</span>` : '',
    p.has_3d ? '<span class="chip ok">3D</span>' : '<span class="chip">no 3D</span>',
    c ? `<span class="chip ${c.enforceable ? 'ok' : ''}">contract · ${(c.rules ?? 0) + (c.companions ?? 0)} clauses</span>` : '',
  ].join('');
}

function renderMore() {
  const end = Math.min(shown + PAGE, filtered.length), frag = document.createDocumentFragment();
  for (let i = shown; i < end; i++) {
    const p = filtered[i], card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="thumbs"><img loading="lazy" alt="" src="${esc(local(p.preview_sym))}"><img loading="lazy" alt="" src="${esc(local(p.preview_fp))}"></div>
      <div class="body">
        <div class="name" title="${esc(p.name)}">${esc(p.name)}</div>
        <div class="sub" title="${esc(p.footprint)}">${esc(p.class)} · ${esc(p.footprint || 'no footprint')}</div>
        <div class="desc">${esc(p.description)}</div>
        <div class="chips">${chipsFor(p)}</div>
      </div>`;
    card.addEventListener('click', () => openDetail(p));
    frag.appendChild(card);
  }
  $('grid').appendChild(frag);
  shown = end;
  $('more').textContent = shown < filtered.length ? `Showing ${shown.toLocaleString()} — scroll for more` : (filtered.length ? '' : 'No part matches.');
}

new IntersectionObserver((e) => { if (e[0].isIntersecting && shown < filtered.length) renderMore(); }, { rootMargin: '600px' }).observe($('more'));
let timer;
for (const id of controls)
  $(id).addEventListener(id === 'q' ? 'input' : 'change', () => { clearTimeout(timer); timer = setTimeout(() => apply(), id === 'q' ? 150 : 0); });

// ── detail ──────────────────────────────────────────────────────────────────
const dlg = $('detail');
$('dClose').onclick = () => dlg.close();
dlg.addEventListener('click', (e) => { if (e.target === dlg) dlg.close(); });

function openDetail(p) {
  $('dName').textContent = p.name;
  $('dSub').textContent = p.description || '';
  $('dSym').src = local(p.preview_sym);
  $('dFp').src = local(p.preview_fp);
  const row = (k, v) => v === undefined || v === null || v === '' ? '' : `<tr><td>${k}</td><td>${v}</td></tr>`;
  const link = (u) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u)}</a>`;
  $('dKv').innerHTML = [
    row('Class', esc(p.class)), row('Tier / score', `${esc(p.tier)} · ${esc(p.score)}`),
    row('Source', esc(p.source)), row('Library', esc(p.library)), row('ID', `<code>${esc(p.id)}</code>`),
    row('Footprint', `<code>${esc(p.footprint)}</code>`),
    row('Pins / pads', `${esc(p.pin_count)} / ${esc(p.pad_count)}`), row('Mount', esc(p.mount)),
    row('3D', p.has_3d ? 'a model in the zip' : 'no model in the zip'),
    row('Keywords', esc((p.keywords || []).join(', '))),
    row('Datasheet', /^https?:/.test(p.datasheet || '') ? link(p.datasheet) : esc(p.datasheet)),
    row('Zip', `<a href="${esc(p.download_url)}">${esc(base(p.download_url))}</a>`),
  ].join('');
  const c = contracts.get(p.slug);
  $('dContract').innerHTML = c
    ? `${esc(c.archetype || c.family || '')} — ${c.rules ?? 0} rule(s), ${c.companions ?? 0} companion(s); ` +
      `${c.enforceable ?? 0} can raise a warning` +
      (c.flags?.length ? `<br><span class="mono">${esc(c.flags.join(' · '))}</span>` : '')
    : (contracts.size ? 'No contract for this part.' : 'The contract index did not load.');
  $('dFiles').innerHTML = '<li class="sub">reading…</li>';
  if (!dlg.open) dlg.showModal();
  viewer.showPart(p);
}

// ── 3D: the model in the zip, on the zip's own pads ──────────────────────────
const viewer = (() => {
  let THREE, OrbitControls, VRMLLoader, renderer, scene, camera, controls, raf = 0, token = 0, occtReady;
  const box = $('v3'), msg = $('v3msg'), info = $('v3info');

  const say = (html) => { msg.style.display = 'flex'; msg.firstElementChild.innerHTML = html; };

  function script(src) {
    return new Promise((ok, fail) => {
      if ([...document.scripts].some((s) => s.src === src)) return ok();
      const s = document.createElement('script');
      s.src = src;
      s.onload = ok;
      s.onerror = () => fail(new Error('could not load ' + src));
      document.head.appendChild(s);
    });
  }

  function occt() {
    const dist = 'https://cdn.jsdelivr.net/npm/occt-import-js@0.0.23/dist/';
    occtReady ||= script(dist + 'occt-import-js.js').then(() => window.occtimportjs({ locateFile: (f) => dist + f }));
    return occtReady;
  }

  async function setup() {
    if (THREE) return;
    const three = await import('three');
    ({ OrbitControls } = await import('three/addons/controls/OrbitControls.js'));
    ({ VRMLLoader } = await import('three/addons/loaders/VRMLLoader.js'));
    await script('https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js');
    THREE = three;
    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    box.appendChild(renderer.domElement);
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1b1d21);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x404040, 1.6));
    const sun = new THREE.DirectionalLight(0xffffff, 1.6);
    sun.position.set(3, 5, 4);
    scene.add(sun);
    camera = new THREE.PerspectiveCamera(35, 1, 0.01, 5000);
    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    new ResizeObserver(resize).observe(box);
  }

  function resize() {
    if (!renderer) return;
    const w = box.clientWidth, h = box.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / Math.max(h, 1);
    camera.updateProjectionMatrix();
  }

  function loop() { raf = requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); }

  function clear() {
    token++;
    cancelAnimationFrame(raf);
    info.innerHTML = '';
    if (!scene) return;
    for (const o of [...scene.children]) {
      if (!o.userData.part) continue;
      scene.remove(o);
      o.traverse((m) => { m.geometry?.dispose(); for (const mat of [].concat(m.material || [])) mat.dispose(); });
    }
    renderer.domElement.style.visibility = 'hidden';
  }

  async function showPart(p) {
    clear();
    const mine = token;
    say('Loading the 3D view…');
    try { await setup(); } catch (e) { say(`The 3D libraries did not load (${esc(e.message)}). They come from a CDN.`); return; }
    let bytes;
    try {
      const r = await fresh(`parts/${encodeURIComponent(p.slug)}.zip`);
      if (!r.ok) throw new Error(String(r.status));
      bytes = await r.arrayBuffer();
    } catch {
      if (mine !== token) return;
      $('dFiles').innerHTML = '<li class="sub">the zip is not here</li>';
      say(`3D is read from the part's zip, and <code>parts/${esc(p.slug)}.zip</code> is not here: parts/ is the ` +
          `release payload, present where the library is built.<br><br>Download <a href="${esc(p.download_url)}">the zip</a> ` +
          `and drop it on this panel.`);
      return;
    }
    if (mine === token) await showZip(bytes, mine);
  }

  async function showZip(bytes, mine) {
    let zip;
    try { zip = await window.JSZip.loadAsync(bytes); } catch (e) { say('Not a readable zip: ' + esc(e.message)); return; }
    const files = Object.values(zip.files).filter((f) => !f.dir);
    $('dFiles').innerHTML = files.map((f) => `<li><code>${esc(f.name)}</code> <span class="sub">${size(f._data?.uncompressedSize)}</span></li>`).join('');
    const fpFile = files.find((f) => f.name.endsWith('.kicad_mod'));
    const fp = fpFile ? await fpFile.async('string') : '';
    const models = files.filter((f) => /\.(step|stp|wrl)$/i.test(f.name));
    let meta = {};
    try { meta = JSON.parse(await zip.file('part.json')?.async('string') || '{}'); } catch { /* no part.json */ }

    const board = new THREE.Group();      // KiCad's 3D frame: x right, y up the board, z out of it
    board.userData.part = true;
    board.rotation.x = -Math.PI / 2;      // three.js is y-up
    const pads = padsOf(fp);
    board.add(drawPads(pads));

    // Only what the app would load: each (model ...) the footprint declares,
    // found in the zip by its file name, or for a .wrl by the .step/.stp of
    // that name (ResolveModelPath, Model3D/Pcb3D_Viewer.cpp). A model in the
    // zip the footprint does not name is never shown by the app, so it is not
    // drawn here either — only listed.
    const notes = [], used = new Set();
    let modelBox = null;
    const blocks = modelBlocks(fp);
    if (blocks.length) say('Reading the model…');
    for (const block of blocks) {
      const f = resolve(models, block.file);
      if (!f) {
        notes.push(`<span class="warn">the footprint names <code>${esc(block.file)}</code>, which the zip does not hold</span>`);
        continue;
      }
      used.add(f.name);
      let obj;
      try {
        obj = /\.wrl$/i.test(f.name) ? fromVrml(await f.async('string')) : await fromStep(await f.async('uint8array'));
      } catch (e) {
        notes.push(`<span class="bad">${esc(f.name)}: ${esc(e.message || e)}</span>`);
        continue;
      }
      if (mine !== token) return;
      const holder = new THREE.Group();
      holder.add(obj);
      place(holder, block);
      board.add(holder);
      board.updateMatrixWorld(true);
      const b = new THREE.Box3().setFromObject(holder);
      modelBox = modelBox ? modelBox.union(b) : b;
      const moved = block.offset.some((v) => v) || block.rotate.some((v) => v) || block.scale.some((v) => v !== 1);
      notes.push(`<b>${esc(f.name)}</b>` +
        (obj.userData.placeholder ? ' <span class="warn">is a placeholder box, not a model</span>' : '') +
        (moved ? ` · offset ${block.offset.map(num).join(', ')} mm · rotate ${block.rotate.map(num).join(', ')}°` : ''));
    }
    for (const f of models)
      if (!used.has(f.name))
        notes.push(`<span class="warn"><code>${esc(f.name)}</code> is in the zip but the footprint does not name it — the app never shows it</span>`);
    if (!blocks.length) notes.push('The footprint declares no model — only the pads are drawn.');
    if (modelBox) {
      const s = modelBox.getSize(new THREE.Vector3());    // world: x across, y up, z along the board's y
      notes.push(`body ${num(s.x)} × ${num(s.z)} mm, ${num(s.y)} mm tall`);
    }
    if (meta.model3d?.upstream) notes.push(`from <code>${esc(meta.model3d.upstream)}</code>`);
    notes.push(`${pads.length} pad(s) from <code>${esc(fpFile?.name || 'no footprint')}</code>`);
    info.innerHTML = notes.join(' · ');

    scene.add(board);
    frame(board);
    msg.style.display = 'none';
    renderer.domElement.style.visibility = 'visible';
    resize();
    cancelAnimationFrame(raf);
    loop();
  }

  // ── the footprint: pads, and where it puts its model ──
  function padsOf(text) {
    const out = [];
    for (const chunk of text.split(/\(pad\s+/).slice(1)) {
      const head = chunk.match(/^("[^"]*"|[^\s()]+)\s+(\w+)\s+(\w+)/);
      const at = chunk.match(/\(at\s+([-\d.e]+)\s+([-\d.e]+)(?:\s+([-\d.e]+))?\s*\)/);
      const sz = chunk.match(/\(size\s+([-\d.e]+)\s+([-\d.e]+)\s*\)/);
      if (!head || !at || !sz) continue;
      const drill = chunk.match(/\(drill\s+(?:oval\s+)?([-\d.e]+)/);
      const layers = (chunk.match(/\(layers\s+([^)]*)\)/) || [])[1] || '';
      out.push({ shape: head[3], x: +at[1], y: +at[2], rot: +(at[3] || 0), w: +sz[1], h: +sz[2],
                 drill: drill ? +drill[1] : 0, back: /\bB\.Cu\b/.test(layers) && !/\bF\.Cu\b|\*\.Cu/.test(layers) });
    }
    return out;
  }

  function drawPads(pads) {
    const g = new THREE.Group();
    const copper = new THREE.MeshStandardMaterial({ color: 0xc8a052, metalness: 0.6, roughness: 0.35 });
    const hole = new THREE.MeshBasicMaterial({ color: 0x0b0c0e });
    const t = 0.035;
    for (const p of pads) {
      let geom;
      if (p.shape === 'circle') geom = new THREE.CylinderGeometry(p.w / 2, p.w / 2, t, 32);
      else if (p.shape === 'oval') geom = capsule(p.w, p.h, t);
      else geom = new THREE.BoxGeometry(p.w, t, p.h);
      const pad = new THREE.Mesh(geom, copper);
      pad.rotation.x = Math.PI / 2;      // the slab's thickness (y) onto z
      const holder = new THREE.Group();
      holder.add(pad);
      if (p.drill) {
        const d = new THREE.Mesh(new THREE.CylinderGeometry(p.drill / 2, p.drill / 2, t * 1.2, 24), hole);
        d.rotation.x = Math.PI / 2;
        holder.add(d);
      }
      // Footprints are y-down; the 3D frame is y-up.
      holder.position.set(p.x, -p.y, p.back ? -t : t / 2);
      holder.rotation.z = THREE.MathUtils.degToRad(p.rot);
      g.add(holder);
    }
    return g;
  }

  function capsule(w, h, t) {
    const r = Math.min(w, h) / 2, len = Math.max(w, h) - 2 * r, s = new THREE.Shape();
    if (w >= h) {
      s.absarc(len / 2, 0, r, -Math.PI / 2, Math.PI / 2, false);
      s.absarc(-len / 2, 0, r, Math.PI / 2, Math.PI * 1.5, false);
    } else {
      s.absarc(0, len / 2, r, 0, Math.PI, false);
      s.absarc(0, -len / 2, r, Math.PI, Math.PI * 2, false);
    }
    const g = new THREE.ExtrudeGeometry(s, { depth: t, bevelEnabled: false, curveSegments: 12 });
    g.translate(0, 0, -t / 2);
    g.rotateX(-Math.PI / 2);             // same convention as the box: outline in x/z, thickness in y
    return g;
  }

  // Every (model "path" (offset ...) (scale ...) (rotate ...)) of the footprint.
  function modelBlocks(fp) {
    return fp.split(/\(model\s+/).slice(1).map((body) => {
      const path = (body.match(/^("[^"]*"|[^\s()]+)/)?.[1] || '').replace(/"/g, '');
      const xyz = (key) => {
        const m = body.match(new RegExp(`\\(${key}\\s*\\(xyz\\s+([-\\d.e]+)\\s+([-\\d.e]+)\\s+([-\\d.e]+)\\s*\\)`));
        return m ? [+m[1], +m[2], +m[3]] : null;
      };
      const inches = xyz('at');          // KiCad 5 wrote the offset in inches, under (at)
      return { file: path.split('/').pop(),
               offset: xyz('offset') || (inches ? inches.map((v) => v * 25.4) : [0, 0, 0]),
               scale: xyz('scale') || [1, 1, 1],
               rotate: xyz('rotate') || [0, 0, 0] };
    });
  }

  function resolve(models, file) {
    const byName = new Map(models.map((f) => [f.name.split('/').pop(), f]));
    const stem = file.replace(/\.[^.]+$/, '');
    return byName.get(file) || (/\.wrl$/i.test(file) ? byName.get(stem + '.step') || byName.get(stem + '.stp') : null);
  }

  // KiCad's order (render_3d_opengl.cpp): translate, rotate by -z, -y, -x, then scale.
  function place(g, pl) {
    const r = (d) => THREE.MathUtils.degToRad(-d);
    const m = new THREE.Matrix4().makeTranslation(...pl.offset)
      .multiply(new THREE.Matrix4().makeRotationZ(r(pl.rotate[2])))
      .multiply(new THREE.Matrix4().makeRotationY(r(pl.rotate[1])))
      .multiply(new THREE.Matrix4().makeRotationX(r(pl.rotate[0])))
      .multiply(new THREE.Matrix4().makeScale(...pl.scale));
    g.matrixAutoUpdate = false;
    g.matrix.copy(m);
  }

  // ── model formats ──
  async function fromStep(bytes) {
    const result = (await occt()).ReadStepFile(bytes, null);
    if (!result.success) throw new Error('the STEP reader refused it');
    const group = new THREE.Group(), cache = new Map();
    const mat = (rgb) => {
      const k = rgb.join(',');
      if (!cache.has(k)) cache.set(k, new THREE.MeshStandardMaterial({ color: new THREE.Color(...rgb), metalness: 0.15, roughness: 0.55, side: THREE.DoubleSide }));
      return cache.get(k);
    };
    for (const m of result.meshes) {
      const geom = new THREE.BufferGeometry();
      geom.setAttribute('position', new THREE.Float32BufferAttribute(m.attributes.position.array, 3));
      if (m.attributes.normal) geom.setAttribute('normal', new THREE.Float32BufferAttribute(m.attributes.normal.array, 3));
      geom.setIndex(new THREE.Uint32BufferAttribute(m.index.array, 1));
      if (!m.attributes.normal) geom.computeVertexNormals();
      const own = m.color || [0.75, 0.75, 0.75];
      let material = mat(own);
      if (m.brep_faces?.some((f) => f.color)) {
        const mats = [mat(own)], slot = new Map([[own.join(','), 0]]);
        for (const f of m.brep_faces) {
          const rgb = f.color || own, k = rgb.join(',');
          if (!slot.has(k)) { slot.set(k, mats.length); mats.push(mat(rgb)); }
          geom.addGroup(f.first * 3, (f.last - f.first + 1) * 3, slot.get(k));
        }
        material = mats;
      }
      group.add(new THREE.Mesh(geom, material));
    }
    return group;
  }

  function fromVrml(text) {
    const holder = new THREE.Group();
    const obj = new VRMLLoader().parse(text, '');
    obj.scale.setScalar(2.54);            // a KiCad VRML unit is 0.1 inch
    holder.add(obj);
    const shapes = [...text.matchAll(/geometry\s+(\w+)/g)].map((m) => m[1]);
    holder.userData.placeholder = shapes.length > 0 && shapes.every((s) => s === 'Box');
    return holder;
  }

  function frame(obj) {
    const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3());
    const r = Math.max(b.getSize(new THREE.Vector3()).length() / 2, 1);
    controls.target.copy(c);
    camera.position.copy(c).add(new THREE.Vector3(1, 0.9, 1.3).normalize().multiplyScalar(r * 3.2));
    camera.near = r / 100;
    camera.far = r * 100;
    camera.updateProjectionMatrix();
  }

  // A zip downloaded by hand can be dropped on the panel.
  box.addEventListener('dragover', (e) => { e.preventDefault(); box.classList.add('drop'); });
  box.addEventListener('dragleave', () => box.classList.remove('drop'));
  box.addEventListener('drop', async (e) => {
    e.preventDefault();
    box.classList.remove('drop');
    const f = e.dataTransfer.files[0];
    if (!f) return;
    clear();
    const mine = token;
    await setup();
    await showZip(await f.arrayBuffer(), mine);
  });

  return { showPart, clear };
})();

dlg.addEventListener('close', () => viewer.clear());

load().catch((e) => {
  $('count').textContent = 'failed';
  note('Could not read the index: ' + esc(e.message) + (location.protocol === 'file:' ? ' — run <code>python3 tools/view.py</code>.' : ''));
});
</script>
</body>
</html>
